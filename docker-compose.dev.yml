version: "3.9"

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - ENV=development
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflowpass
      - POSTGRES_DB=mlflow_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_BACKEND_STORE_URI=postgresql://mlflow:mlflowpass@postgres:5432/mlflow_db
    depends_on:
      - postgres
      - mlflow
    command: uvicorn career_assistant.api.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflowpass
      POSTGRES_DB: mlflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mlflow:
    container_name: mlflow
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5000:5000"
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql://mlflow:mlflowpass@postgres:5432/mlflow_db
      - --default-artifact-root
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --allowed-hosts
      - "*"
      - --cors-allowed-origins
      - "*"
    depends_on:
      - postgres

  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
volumes:
  pgdata:
  mlflow_artifacts:
  qdrant_storage:
